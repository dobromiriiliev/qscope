[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qscope-hamiltonian-diagnosis"
version = "0.1.0"
description = "Active Hamiltonian drift diagnosis with Qiskit"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "qiskit==2.5.2",
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "matplotlib>=3.8,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
qscope = "qscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
