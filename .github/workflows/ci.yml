name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: qscope preflight
      - run: qscope demo --config configs/smoke.json --output artifacts/smoke.json --plot artifacts/smoke.png
      - run: qscope validate-submission
